<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울시 열환경 시뮬레이터</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--border:#e3e6eb;
  --blue:#2563eb;--blue-l:#dbeafe;
  --red:#ef4444;--red-l:#fef2f2;
  --green:#16a34a;--green-l:#f0fdf4;
  --amber:#f59e0b;--amber-l:#fefce8;
  --text:#1e293b;--sub:#64748b;--muted:#94a3b8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text)}
button{cursor:pointer;font-family:inherit}

.header{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;padding:14px 28px;display:flex;align-items:center;gap:14px}
.header h1{font-size:18px;font-weight:800}
.header .sub{font-size:12px;opacity:.7}

.sel-bar{background:#fff;border-bottom:1px solid var(--border);padding:14px 28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sel-bar input,.sel-bar select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;background:#fff}
.sel-bar input:focus,.sel-bar select:focus{border-color:var(--blue)}

.sw{position:relative}
.dd{position:absolute;top:100%;left:0;z-index:99;background:#fff;border:1px solid var(--border);border-radius:8px;width:250px;max-height:220px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.12);display:none}
.dd.show{display:block}
.dd div{padding:8px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid #f1f5f9}
.dd div:hover{background:#f1f5f9}
.dd div b{font-weight:600}
.dd div span{color:var(--muted);margin-left:6px;font-size:12px}
.si{font-size:14px;font-weight:600;color:var(--text);margin-left:8px}

.main{display:flex;flex-direction:column;gap:16px;padding:20px 28px;max-width:960px;margin:0 auto;}
.col{flex:1;min-width:0}

.sh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sn{width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sl{font-size:14px;font-weight:700}

.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:10px}
.sg{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.sc{text-align:center;background:#fafbfc;border-radius:8px;padding:12px 8px;border:1px solid var(--border)}
.sc .lb{font-size:11px;color:var(--muted);margin-bottom:4px}
.sc .vl{font-size:24px;font-weight:800}
.sc .vl.hot{color:var(--red)}
.sc .vl.rk{color:var(--blue)}

.sr{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid #f1f5f9}
.sv{font-weight:700}
.sv.up{color:var(--red)}
.sv.dn{color:var(--green)}
.ss{font-size:12px;color:var(--sub);margin-top:8px;padding:8px;background:#f8fafc;border-radius:6px;line-height:1.6}
.cause{font-size:12px;color:var(--sub);margin-top:6px;padding:7px 10px;background:#eff6ff;border-left:3px solid var(--blue);border-radius:0 6px 6px 0;line-height:1.6}
.mn{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}

.pt{display:flex;gap:4px;margin-bottom:12px}
.ptb{flex:1;padding:8px 4px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;text-align:center;background:#fff;transition:all .2s}
.ptb.a{background:var(--blue);color:#fff;border-color:var(--blue)}

.slg{margin-bottom:16px}
.slt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.sln{font-size:13px;font-weight:600}
.slc{font-size:12px;color:var(--sub)}
.slc b{color:var(--text)}
.sld{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:700;margin-left:6px}
.sld.pos{background:var(--blue-l);color:var(--blue)}
.sld.neg{background:var(--red-l);color:var(--red)}

input[type=range]{
  width:100%;height:6px;margin:6px 0;
  -webkit-appearance:none;appearance:none;
  border-radius:4px;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:16px;height:16px;border-radius:50%;
  background:var(--blue);border:2px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.2);
}
input[type=range]::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;
  background:var(--blue);border:2px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.2);
}
.slm{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

.ar{margin-top:6px;padding:6px 10px;background:#f1f5f9;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:6px}
.ar input{width:60px;padding:2px 6px;border:1px solid var(--border);border-radius:4px;font-size:12px;text-align:center}

.bc{padding:8px 12px;background:var(--amber-l);border-radius:6px;font-size:12px;color:#92400e;margin-bottom:10px}

.bs{width:100%;padding:12px 0;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700}
.bs:hover{opacity:.9}
.bs:disabled{opacity:.5}

.bo{padding:6px 16px;border-radius:20px;font-size:12px;font-weight:600;background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.bo:hover{background:var(--blue);color:#fff}

.ob{display:inline-block;background:var(--red);color:#fff;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:10px}

.rb{text-align:center;padding:20px}
.rb .ls{font-size:38px;font-weight:800}
.rb .dt{font-size:18px;font-weight:700}
.rb .dt.cool{color:var(--green)}
.rb .dt.warm{color:var(--red)}
.rb .er{font-size:11px;color:var(--muted);margin-top:4px}

.ib{padding:14px;background:var(--green-l);border-left:3px solid var(--green);border-radius:8px;margin-bottom:10px}
.ib .tt{font-size:12px;font-weight:700;color:var(--green);margin-bottom:4px}
.ib p{font-size:13px;line-height:1.7}

.et{width:100%;border-collapse:collapse;font-size:12px}
.et th{text-align:left;padding:8px;font-weight:600;border-bottom:2px solid var(--border)}
.et td{padding:7px 8px;border-bottom:1px solid #f1f5f9}

.ac{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}
.acb{width:100%;padding:10px 14px;text-align:left;font-size:13px;font-weight:600;background:#fff;border:none;color:var(--text)}
.acb:hover{background:#f8fafc}
.acd{padding:8px 14px 14px;font-size:12px;line-height:1.7;display:none}
.acd.o{display:block}

.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row button{flex:1;padding:9px 0;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer}
.btn-exp{background:var(--blue);color:#fff}
.btn-exp:hover{opacity:.9}
.btn-ref{background:#f1f5f9;color:var(--text);border:1px solid var(--border)!important}
.btn-ref:hover{background:#e2e8f0}

.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;justify-content:center;align-items:center;z-index:100}
.mo.show{display:flex}
.ml{background:#fff;border-radius:14px;padding:28px;width:460px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.ml h3{font-size:18px;margin-bottom:16px}
.mp{display:flex;gap:6px;margin-bottom:16px}
.mpb{flex:1;padding:7px 4px;border-radius:8px;font-size:12px;font-weight:600;text-align:center;background:#f1f5f9;border:none}
.mpb.a{background:var(--blue);color:#fff}
.mbi{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:16px;font-weight:700}
.mr{margin-top:16px;padding:16px;background:#f8fafc;border-radius:10px}

.ph{color:var(--muted);font-size:13px;text-align:center;padding:40px 0}
</style>
</head>
<body>

<div class="header">
  <h1>🌡️ 서울시 열환경 시뮬레이터</h1>
  <span class="sub">행정동별 도시열섬 완화 지원 AI 시뮬레이터</span>
</div>

<div id="mT" style="display:none;background:#fef3c7;border-bottom:1px solid #fbbf24;padding:7px 28px;font-size:12px;color:#92400e;font-weight:600"></div>
<div class="sel-bar">
  <div class="sw">
    <input id="dI" placeholder="행정동 검색 (예: 신사동)" style="width:200px" autocomplete="off">
    <div class="dd" id="dD"></div>
  </div>
  <select id="yS"></select>
  <select id="mS"></select>
  <span class="si" id="sI">행정동을 검색하세요</span>
</div>

<div class="main">
  <!-- Step 1 -->
  <div class="col">
    <div class="sh">
      <div class="sn" style="background:#3b82f6">1</div>
      <span class="sl">step 1 | 현재 정도</span>
    </div>
    <div id="s1"><div class="ph">행정동과 연월을 선택하면<br>현황이 표시됩니다.</div></div>
  </div>

  <!-- Step 2 -->
  <div class="col">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="sh" style="margin-bottom:0">
        <div class="sn" style="background:#f59e0b">2</div>
        <span class="sl">step 2 | 정책 시뮬레이션</span>
      </div>
      <button class="bo" onclick="openM()">예산별 최적 추천 보기</button>
    </div>
    <div class="pt" id="pT"></div>
    <div class="card" id="sC"><div class="ph">데이터 로딩 중...</div></div>
    <div id="bC"></div>
    <button class="bs" id="bS" onclick="runSim()" disabled>시뮬레이션 실행 →</button>
  </div>

  <!-- Step 3 -->
  <div class="col">
    <div class="sh">
      <div class="sn" style="background:#22c55e">3</div>
      <span class="sl">step 3 | 정책 효과 분석</span>
    </div>
    <div id="s3"><div class="ph">Step 2에서 변수를 조정한 뒤<br>"시뮬레이션 실행"을 눌러주세요</div></div>
  </div>
</div>

<!-- 예산별 최적 추천 모달 -->
<div class="mo" id="oM" onclick="if(event.target===this)closeM()">
  <div class="ml">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3>예산별 최적 추천</h3>
      <button onclick="closeM()" style="font-size:20px;background:none;border:none;color:var(--muted)">✕</button>
    </div>
    <p style="font-size:13px;font-weight:600;margin-bottom:6px">패키지 선택</p>
    <div class="mp" id="mP"></div>
    <p style="font-size:13px;font-weight:600;margin-bottom:6px">총 예산 입력</p>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <input class="mbi" id="oB" value="50000000"><span>원</span>
    </div>
    <p style="font-size:11px;color:var(--muted);margin-bottom:16px">선택한 패키지 내 변수를 대상으로 입력 예산 범위 내 최적 조합을 탐색합니다.</p>
    <div style="display:flex;gap:10px">
      <button onclick="closeM()" style="flex:1;padding:10px;background:#f1f5f9;border:none;border-radius:8px;font-size:14px">닫기</button>
      <button id="oR" onclick="runOpt()" style="flex:1;padding:10px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700">추천 받기</button>
    </div>
    <div id="oA"></div>
  </div>
</div>

<script>
const A = '';
let dL = [], sC = [], sV = {}, sm = null;
let aC = '', aN = '', gN = '', aP = '녹지', oP = '녹지', iO = false;
let albedoRatio = 25;
let _lastSim = null, _lastIns = null;

const PK = [
  { k: '녹지',    i: '🌿', l: ['녹지율', '총_가로수', '누적_조성면적'] },
  { k: '건축·포장', i: '🏗️', l: ['Albedo', 'NDBI', 'NDVI'] },
  { k: '에너지',  i: '⚡', l: ['에너지_전기', '에너지_가스', '차량밀도'] },
  { k: '폭염저감', i: '☂️', l: ['그늘막'] },
];

const FK = {
  'Albedo': 'Albedo (반사율)', 'NDBI': 'NDBI (건물밀집도)', 'NDVI': 'NDVI (녹지)',
  '그늘막': '그늘막 개수', '녹지율': '녹지율', '누적_조성면적': '옥상녹화 조성면적',
  '총_가로수': '가로수 개수', '에너지_전기': '에너지사용량_전기',
  '에너지_가스': '에너지사용량_가스', '차량밀도': '차량밀도',
  '용적률': '용적률', '인구밀도': '인구밀도',
};

const FKC = {
  'Albedo': 'Albedo (반사율)', 'NDBI': 'NDBI (건물밀집도)', 'NDVI': 'NDVI (녹지)',
  '그늘막 개수': '그늘막 개수', '녹지율': '녹지율',
  '누적_조성면적합계(m^2)': '옥상녹화 조성면적',
  '총_가로수_개수': '가로수 개수',
  '에너지사용량_전기': '에너지사용량_전기', '에너지사용량_가스': '에너지사용량_가스',
  '차량밀도': '차량밀도', '용적률_행정동별': '용적률', '인구밀도': '인구밀도',
};

function fmtCost(won) {
  if (!won || won <= 0) return '—';
  if (won >= 1e8)  return `약 ${(won / 1e8).toFixed(1)}억원`;
  if (won >= 1e4)  return `약 ${Math.round(won / 1e4)}만원`;
  return won.toLocaleString() + '원';
}

const DF = {
  'Albedo': '중', 'NDBI': '상', 'NDVI': '상', '그늘막': '하',
  '녹지율': '상', '누적_조성면적': '중', '총_가로수': '하',
  '에너지_전기': '중', '에너지_가스': '중', '차량밀도': '중',
  '용적률': '상', '인구밀도': '상',
};

const MT = {
  'Albedo': '지붕 쿨루프 도색 (건물주 동의)',
  'NDBI': '건축밀도 규제', 'NDVI': '녹지 확충',
  '그늘막': '스마트 그늘막 설치 (자치구 직접 집행)',
  '녹지율': '공공용지 녹지 조성 (토지 확보 필요)',
  '누적_조성면적': '옥상녹화 조성',
  '총_가로수': '가로구간 보식·식재',
  '에너지_전기': '에코마일리지 인센티브',
  '에너지_가스': '에코마일리지 가스 절감',
  '차량밀도': '승용차 마일리지',
  '용적률': '도시계획 조정', '인구밀도': '주택공급 연동',
};

const SK = { JJA: '여름(JJA)', DJF: '겨울(DJF)', MAM: '봄(MAM)', SON: '가을(SON)' };

function $(id) { return document.getElementById(id); }

window.onload = async () => {
  try {
    const [d, m] = await Promise.all([
      fetch(A + '/summary/dong-list').then(r => r.json()),
      fetch(A + '/summary/years-months').then(r => r.json()),
    ]);
    dL = d;

    const ys = $('yS');
    (m.years || []).forEach(y => {
      const o = document.createElement('option');
      o.value = y; o.text = y + '년';
      ys.appendChild(o);
    });
    ys.value = m.years[m.years.length - 1] || 2024;

    const ms = $('mS');
    (m.months || []).forEach(mo => {
      const o = document.createElement('option');
      o.value = mo; o.text = mo + '월';
      ms.appendChild(o);
    });
    ms.value = 8;
  } catch (e) { console.error(e); }

  rPT(); rMP();
};

const dI = $('dI'), dD = $('dD');
dI.addEventListener('input', () => {
  const q = dI.value.trim();
  if (!q) { dD.classList.remove('show'); return; }
  const f = dL.filter(d => {
    const n = d.adm_nm || d.ADM_NM || '';
    const g = d.gu_nm  || d.자치구 || '';
    return n.includes(q) || g.includes(q);
  }).slice(0, 10);
  dD.innerHTML = f.map(d => {
    const n = d.adm_nm || d.ADM_NM || '';
    const g = d.gu_nm  || d.자치구 || '';
    return `<div onclick="selD('${d.adm_cd}','${n}','${g}')"><b>${n}</b><span>${g}</span></div>`;
  }).join('');
  dD.classList.toggle('show', f.length > 0);
});
dI.addEventListener('blur', () => setTimeout(() => dD.classList.remove('show'), 200));

function selD(c, n, g) {
  aC = c; aN = n; gN = g;
  dI.value = '';
  dD.classList.remove('show');
  $('sI').innerHTML = `<b>${g} ${n}</b>`;
  ldA();
}
$('yS').addEventListener('change', () => { if (aC) ldA(); });
$('mS').addEventListener('change', () => { if (aC) ldA(); });

async function ldA() {
  $('bS').disabled = true;
  $('s1').innerHTML = '<div class="ph">로딩 중...</div>';
  $('s3').innerHTML = '<div class="ph">Step 2에서 변수를 조정한 뒤<br>"시뮬레이션 실행"을 눌러주세요</div>';
  iO = false; _lastSim = null; _lastIns = null;

  try {
    const y = $('yS').value, mo = $('mS').value;
    const [s, sl] = await Promise.all([
      fetch(`${A}/summary?adm_cd=${aC}&year=${y}&month=${mo}`).then(r => r.json()),
      fetch(`${A}/summary/slider-config?adm_cd=${aC}&year=${y}&month=${mo}`).then(r => r.json()),
    ]);
    sm = s;
    sC = sl;
    sV = {};
    sC.forEach(s => { sV[s.label] = s.current_value; });
    rS1(s);
    rSL();
    rBC(s);
    $('bS').disabled = false;
  } catch (e) {
    $('s1').innerHTML = `<div class="ph">오류: ${e.message}</div>`;
  }
}

function rS1(s) {
  const h = s.current_lst > (s.seoul_avg || 0);
  const t3 = s.shap_top3 || [];

  const sh = t3.map((x, i) => {
    const cl = x.direction === '상승' ? 'up' : 'dn';
    const sg = x.shap_value > 0 ? '+' : '';
    return `<div class="sr">
      <span>${i + 1}. ${FKC[x.feature] || FK[x.feature] || x.feature}</span>
      <span class="sv ${cl}">${sg}${x.shap_value}°C</span>
    </div>`;
  }).join('');

  const ups = t3.filter(x => x.direction === '상승').map(x => FKC[x.feature] || FK[x.feature] || x.feature);
  const dns = t3.filter(x => x.direction === '하강').map(x => FKC[x.feature] || FK[x.feature] || x.feature);
  let ct = '';
  if (ups.length) ct += ups.join(', ') + '이(가) 주요 상승 원인';
  if (dns.length) ct += (ct ? '이며, ' : '') + dns.join(', ') + '이(가) 일부 완화 중';

  const causeHtml = s.cause_summary
    ? `<div class="cause">💡 ${s.cause_summary}</div>`
    : (ct ? `<div class="ss">${ct}</div>` : '');

  $('s1').innerHTML = `
    <div class="sg">
      <div class="sc"><div class="lb">현재 LST</div><div class="vl ${h ? 'hot' : ''}">${s.current_lst}°C</div></div>
      <div class="sc"><div class="lb">서울 평균</div><div class="vl">${s.seoul_avg}°C</div></div>
      <div class="sc"><div class="lb">3년 평균</div><div class="vl">${s.three_yr_avg_lst != null ? s.three_yr_avg_lst + '°C' : '—'}</div></div>
      <div class="sc"><div class="lb">${s.gu_nm || ''} 내</div><div class="vl rk">${s.rank_in_gu || '-'}위</div></div>
    </div>
    <div class="card" style="padding:12px 16px">
      <div style="font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px">LST 비교 (°C)</div>
      <canvas id="lstChart" height="100"></canvas>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:13px;font-weight:700">이 동네 핵심 변수 TOP 3 (SHAP)</span>
        <span class="mn" title="모델 기반 추정으로 실제와 차이가 있을 수 있음">ⓘ 모델 기반 추정</span>
      </div>
      ${sh}
      ${causeHtml}
    </div>`;

  if (window._lstChart) { window._lstChart.destroy(); window._lstChart = null; }
  const _vals = [s.current_lst, s.seoul_avg, s.three_yr_avg_lst].filter(v => v != null);
  const _labels = ['현재', '서울평균', '3년평균'].slice(0, _vals.length);
  const _colors = [
    s.current_lst > s.seoul_avg ? 'rgba(239,68,68,0.85)' : 'rgba(37,99,235,0.85)',
    'rgba(148,163,184,0.85)',
    'rgba(96,165,250,0.85)',
  ].slice(0, _vals.length);
  const _min = Math.floor(Math.min(..._vals) - 1);
  const _max = Math.ceil(Math.max(..._vals) + 1);
  const _ctx = document.getElementById('lstChart');
  if (_ctx) {
    window._lstChart = new Chart(_ctx, {
      type: 'bar',
      data: {
        labels: _labels,
        datasets: [{ data: _vals, backgroundColor: _colors, borderRadius: 6, borderSkipped: false }],
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: c => c.raw + '°C' } },
        },
        scales: {
          y: {
            min: _min, max: _max,
            ticks: { callback: v => v + '°C', font: { size: 10 } },
            grid: { color: '#f1f5f9' },
          },
          x: { ticks: { font: { size: 12, weight: '600' } }, grid: { display: false } },
        },
      },
    });
  }
}

function rPT() {
  $('pT').innerHTML = PK.map(p =>
    `<button class="ptb ${p.k === aP ? 'a' : ''}" onclick="sP('${p.k}')">${p.i} ${p.k}</button>`
  ).join('');
}
function sP(k) { aP = k; rPT(); rSL(); }

function rSL() {
  const pk = PK.find(p => p.k === aP);
  if (!pk) return;
  const its = sC.filter(s => pk.l.includes(s.label));
  if (!its.length) {
    $('sC').innerHTML = '<div class="ph">이 패키지에 해당하는 변수가 없습니다.</div>';
    return;
  }

  $('sC').innerHTML = its.map(s => {
    const v   = sV[s.label] ?? s.current_value;
    const d   = v - s.current_value;
    const hd  = Math.abs(d) > 1e-8;
    const sg  = d >= 0 ? '+' : '';
    const dc  = d > 0 ? 'pos' : 'neg';
    const ut  = s.adjustment_unit || (s.is_ratio_step ? `${(s.ratio * 100)}%` : s.step);
    const rng = s.safe_high - s.safe_low;
    const pct = rng > 0 ? (((v - s.safe_low) / rng) * 100).toFixed(1) : 0;
    const fill = `linear-gradient(to right,var(--blue) ${pct}%,#e2e8f0 ${pct}%)`;

    let ex = '';
    if (s.label === 'Albedo') {
      ex = `<div class="ar">적용 면적 비율 입력:
        <input id="aR" type="number" min="0" max="100" value="${albedoRatio}"
          oninput="albedoRatio=parseInt(this.value)||0"> %
      </div>`;
    }

    return `<div class="slg">
      <div class="slt">
        <span class="sln">${FK[s.label] || s.label}</span>
        <span class="slc">현재 <b>${s.current_value}</b>
          <span data-delta="${s.label}" class="sld ${dc}" style="display:${hd ? '' : 'none'}">${hd ? sg + d.toFixed(4) : ''}</span>
        </span>
      </div>
      <input type="range" data-label="${s.label}"
        min="${s.safe_low}" max="${s.safe_high}" step="${s.step || 0.001}" value="${v}"
        style="${fill}"
        oninput="oS('${s.label}',this.value,this)">
      <div class="slm"><span>조정범위: ${s.safe_low} ~ ${s.safe_high} · 단위: ${ut}</span></div>
      ${ex}
    </div>`;
  }).join('');
}

function oS(l, v, el) {
  const val = parseFloat(v);
  sV[l] = val;
  iO = false;

  const s = sC.find(x => x.label === l);
  if (!s) return;

  if (el) {
    const rng = s.safe_high - s.safe_low;
    const pct = rng > 0 ? (((val - s.safe_low) / rng) * 100).toFixed(1) : 0;
    el.style.background = `linear-gradient(to right,var(--blue) ${pct}%,#e2e8f0 ${pct}%)`;
  }

  const dEl = document.querySelector(`[data-delta="${l}"]`);
  if (dEl) {
    const d  = val - s.current_value;
    const hd = Math.abs(d) > 1e-8;
    if (hd) {
      dEl.textContent = (d > 0 ? '+' : '') + d.toFixed(4);
      dEl.className = 'sld ' + (d > 0 ? 'pos' : 'neg');
      dEl.style.display = '';
    } else {
      dEl.style.display = 'none';
    }
  }
}

function rBC(s) {
  if (!s || !s.background) return;
  const b = s.background;
  $('bC').innerHTML = `<div class="bc">배경 조건: 기온 ${(b.avg_temp || 0).toFixed(1)}°C · 계절 ${SK[b.season] || b.season} · ${b.year || ''}년<br>
    <span style="font-size:11px">여름 계절성이 LST 예측에 가장 크게 작용하며, 동일 정책이라도 겨울 대비 저감 효과가 더 크게 나타납니다.</span>
  </div>`;
}

async function runSim() {
  const y = $('yS').value, mo = $('mS').value;
  const btn = $('bS');
  btn.disabled = true; btn.textContent = '계산 중...';

  const ft = {};
  sC.forEach(s => {
    const v = sV[s.label] ?? s.current_value;
    if (Math.abs(v - s.current_value) > 1e-8) ft[s.label] = v;
  });

  if (!Object.keys(ft).length) {
    btn.disabled = false; btn.textContent = '시뮬레이션 실행 →';
    alert('변수를 조정해주세요.');
    return;
  }

  const ra = albedoRatio / 100;

  try {
    const si = await fetch(A + '/simulate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        adm_cd: aC, year: +y, month: +mo,
        features: ft, albedo_area_ratio: ra,
      }),
    }).then(r => r.json());

    const ins = await fetch(A + '/insight', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        delta_T: si.delta_T,
        features: ft,
        adm_nm: aN,
        month: +mo,
        background: sm?.background || null,
      }),
    }).then(r => r.json());

    _lastSim = si; _lastIns = ins;
    rS3(si, ins);
    const mt = $('mT');
    if (mt) {
      if (si.model_type === 'fallback_ridge') {
        mt.innerHTML = '⚠️ Ridge 폴백 모델 사용 중 (model.pkl 없음 — 참고용)';
        mt.style.display = 'block';
      } else if (si.model_type === 'lightgbm') {
        mt.innerHTML = '✅ LightGBM 모델 사용 중';
        mt.style.display = 'block';
      }
    }
  } catch (e) {
    alert('오류: ' + e.message);
  }
  btn.disabled = false; btn.textContent = '시뮬레이션 실행 →';
}

function rS3(si, ins) {
  const dc = si.delta_T < 0 ? 'cool' : si.delta_T > 0 ? 'warm' : '';
  const sg = si.delta_T > 0 ? '+' : '';

  const rows = Object.entries(si.adjusted_features || {}).map(([l, v]) => {
    const cfg = sC.find(s => s.label === l);
    const cur = cfg ? cfg.current_value : 0;
    const d   = v - cur;
    const ds  = d > 0 ? '+' : '';
    const costRaw = cfg ? (cfg.cost_per_step || 0) : 0;
    const costStr = fmtCost(costRaw);
    const diff = DF[l] || '중';
    const diffCl = diff === '하' ? 'color:var(--green)' : diff === '상' ? 'color:var(--red)' : 'color:var(--amber)';

    return `<tr>
      <td>${FK[l] || l}<br><span style="color:var(--sub);font-size:11px">(${ds}${d.toFixed(4)})</span></td>
      <td style="text-align:right">${costStr}</td>
      <td style="text-align:center;font-weight:700;${diffCl}">${diff}</td>
      <td style="font-size:11px">${MT[l] || '—'}</td>
    </tr>`;
  }).join('');

  $('s3').innerHTML = `
    ${iO ? '<div class="ob">● 최적 추천 모드</div>' : ''}
    <div class="card rb">
      <div style="font-size:11px;color:var(--muted)">예상 LST</div>
      <div class="ls">${si.after_lst}°C</div>
      <div class="dt ${dc}">(${sg}${si.delta_T}°C)</div>
      <div class="er">| 오차범위 ±0.4°C</div>
    </div>
    ${ins ? `<div class="ib">
      <div class="tt">정책 완화 인사이트 핵심 요약 [AI 생성]</div>
      <p>${ins.summary}</p>
    </div>` : ''}
    ${rows ? `<div class="card" style="padding:12px 16px">
      <div style="font-size:13px;font-weight:700;margin-bottom:8px">정책 효과 비교</div>
      <table class="et">
        <thead><tr><th>정책 변수</th><th>예상 비용</th><th>난이도</th><th>방법</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>` : ''}
    ${ins ? `
    <div class="ac"><button class="acb" onclick="tA(this)">▸ 주의요망</button><div class="acd">${ins.caution}</div></div>
    <div class="ac"><button class="acb" onclick="tA(this)">▸ 전망</button><div class="acd">${ins.outlook}</div></div>
    ` : ''}
    <div class="btn-row">
      <button class="btn-exp" onclick="exportCSV()">📥 시트 내보내기</button>
      <button class="btn-ref" onclick="window.open('https://www.notion.so','_blank')">📎 비용 산출 근거 확인</button>
    </div>`;
}

function tA(b) {
  const d = b.nextElementSibling;
  d.classList.toggle('o');
  b.textContent = d.classList.contains('o')
    ? b.textContent.replace('▸', '▾')
    : b.textContent.replace('▾', '▸');
}

function exportCSV() {
  if (!_lastSim) { alert('시뮬레이션을 먼저 실행해주세요.'); return; }
  const si  = _lastSim;
  const y   = $('yS').value;
  const mo  = $('mS').value.toString().padStart(2, '0');

  const rows = [
    ['행정동', aN], ['자치구', gN], ['연도', y], ['월', mo],
    ['현재 LST (°C)', si.before_lst],
    ['예상 LST (°C)', si.after_lst],
    ['ΔT (°C)', si.delta_T],
    [],
    ['정책 변수', '현재값', '조정값', '변화량', '예상 비용(만원)'],
    ...Object.entries(si.adjusted_features || {}).map(([l, v]) => {
      const cfg  = sC.find(s => s.label === l);
      const cur  = cfg ? cfg.current_value : 0;
      const cost = cfg ? Math.round((cfg.cost_per_step || 0) / 10000) : 0;
      return [FK[l] || l, cur, v, (v - cur).toFixed(4), cost || '—'];
    }),
  ];

  const csv  = rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `${aN}_${y}${mo}_시뮬레이션결과.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function rMP() {
  const a = [...PK.map(p => p.k), '전체'];
  $('mP').innerHTML = a.map(k =>
    `<button class="mpb ${k === oP ? 'a' : ''}" onclick="sOP('${k}')">${k}</button>`
  ).join('');
}
function sOP(k) { oP = k; rMP(); }
function openM() { $('oM').classList.add('show'); $('oA').innerHTML = ''; }
function closeM() { $('oM').classList.remove('show'); }

const PM = { '녹지': '녹지', '건축·포장': '건축포장', '에너지': '에너지', '폭염저감': '폭염저감', '전체': '전체' };

async function runOpt() {
  const btn = $('oR');
  btn.disabled = true; btn.textContent = '분석 중...';
  const y = $('yS').value, mo = $('mS').value;
  const b = parseInt($('oB').value) || 0;

  try {
    const r = await fetch(A + '/optimize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        adm_cd: aC, year: +y, month: +mo,
        budget: b, package: PM[oP] || oP,
      }),
    }).then(r => r.json());

    let trows = '';
    if (r.recommended && r.recommended.length) {
      trows = r.recommended.map(x =>
        `<tr>
          <td>${FK[x.feature_label] || x.feature_label}<br>
            <span style="color:var(--sub)">(${x.delta > 0 ? '+' : ''}${x.delta})</span>
          </td>
          <td style="text-align:right">${(x.cost || 0).toLocaleString()}원</td>
        </tr>`
      ).join('');
    }

    $('oA').innerHTML = `<div class="mr">
      <div style="font-size:14px;font-weight:700;margin-bottom:8px">
        예상 ΔLST: <span style="color:var(--green)">${r.expected_delta_T}°C</span>
      </div>
      <div style="font-size:12px;color:var(--sub);margin-bottom:8px">
        사용 예산: ${(r.used_budget || 0).toLocaleString()}원
        ${r.savings > 0 ? ` (절감: ${r.savings.toLocaleString()}원)` : ''}
      </div>
      ${trows
        ? `<table class="et"><thead><tr><th>변수</th><th>비용</th></tr></thead><tbody>${trows}</tbody></table>
           <button onclick="apOpt()" style="width:100%;margin-top:12px;padding:10px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer">적용 →</button>`
        : '<p style="font-size:12px;color:var(--muted)">model.pkl 배포 후 추천 가능합니다.</p>'}
    </div>`;
    window._oR = r;
  } catch (e) {
    $('oA').innerHTML = `<div class="mr"><p style="color:var(--red)">오류: ${e.message}</p></div>`;
  }
  btn.disabled = false; btn.textContent = '추천 받기';
}

function apOpt() {
  const r = window._oR;
  if (!r?.recommended) return;
  r.recommended.forEach(x => { sV[x.feature_label] = x.recommended_value; });
  iO = true;
  closeM();
  rSL();
  setTimeout(runSim, 200);
}
</script>
</body>
</html>
